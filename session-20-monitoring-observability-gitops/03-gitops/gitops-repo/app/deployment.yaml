apiVersion: apps/v1
kind: Deployment
metadata:
  name: notice-board
  labels: {app: notice-board}
spec:
  replicas: 2
  selector:
    matchLabels: {app: notice-board}
  template:
    metadata:
      labels: {app: notice-board}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
      volumes:
        - name: page
          configMap: {name: notice-board-page}
