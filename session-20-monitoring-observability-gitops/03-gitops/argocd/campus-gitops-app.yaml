# Applied once by an admin. From then on Argo CD keeps the cluster equal to Git.
# Kept outside the watched app/ path on purpose.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: campus-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ratnesh/campus-gitops.git
    targetRevision: main
    path: app
  destination:
    server: https://kubernetes.default.svc
    namespace: campus-gitops
  syncPolicy:
    automated:
      prune: true        # delete what was removed from Git
      selfHeal: true     # undo manual changes made in the cluster
    syncOptions:
      - CreateNamespace=true
