apiVersion: v1
kind: Namespace
metadata:
  name: session20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-status
  namespace: session20
  labels:
    app: campus-status
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-status
  template:
    metadata:
      labels:
        app: campus-status
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: localhost:5001/session20-campus-status:1.0.0
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: ERROR_RATE         # random failures on /api/flaky (0 = none)
              value: "0"
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 48Mi}
            limits: {cpu: 300m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: campus-status
  namespace: session20
  labels:
    app: campus-status
spec:
  selector:
    app: campus-status
  ports:
    - name: http
      port: 80
      targetPort: http
