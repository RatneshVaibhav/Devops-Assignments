# Stand-in for the team's chat/pager integration: a webhook endpoint that prints
# every notification Alertmanager sends (firing and resolved).
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-receiver
  namespace: session20
data:
  receiver.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Hook(BaseHTTPRequestHandler):
        def do_POST(self):
            body = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
            for a in body["alerts"]:
                print(f'NOTIFY [{body["receiver"]}] {a["status"].upper():8} {a["labels"]["alertname"]} '
                      f'severity={a["labels"].get("severity")} - {a["annotations"].get("summary")}', flush=True)
            self.send_response(200)
            self.end_headers()

        def log_message(self, *args):
            pass

    HTTPServer(("0.0.0.0", 8080), Hook).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: session20
spec:
  replicas: 1
  selector:
    matchLabels: {app: alert-receiver}
  template:
    metadata:
      labels: {app: alert-receiver}
    spec:
      containers:
        - name: receiver
          image: python:3.12-alpine
          command: ["python", "-u", "/app/receiver.py"]
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 48Mi}
          volumeMounts:
            - {name: code, mountPath: /app}
      volumes:
        - name: code
          configMap: {name: alert-receiver}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: session20
spec:
  selector: {app: alert-receiver}
  ports:
    - port: 8080
