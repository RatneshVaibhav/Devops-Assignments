apiVersion: v1
kind: Namespace
metadata:
  name: session16
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cgpa-calculator
  namespace: session16
  labels:
    app: cgpa-calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cgpa-calculator
  template:
    metadata:
      labels:
        app: cgpa-calculator
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER          # replaced by the pipeline with <registry>/<owner>/session16-cgpa-calculator:<sha>
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
