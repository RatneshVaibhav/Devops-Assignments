apiVersion: apps/v1
kind: Deployment
metadata:
  name: lost-and-found
  namespace: session17
  labels:
    app: lost-and-found
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lost-and-found
  template:
    metadata:
      labels:
        app: lost-and-found
    spec:
      automountServiceAccountToken: false     # the app never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER        # set by the pipeline: <registry>/<owner>/session17-lost-and-found:<sha>
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          volumeMounts:
            - name: tmp                   # gunicorn needs a writable /tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
