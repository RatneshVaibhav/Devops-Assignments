# helm test: the API answers through its Service and the database is reachable
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "shelfshare.name" . }}-test-api
  labels: {{- include "shelfshare.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: smoke
      image: busybox:1.36
      command: ["sh", "-c", "wget -qO- http://{{ include "shelfshare.name" . }}-backend:8000/ready && wget -qO- http://{{ include "shelfshare.name" . }}-frontend/healthz"]
      securityContext: {{- include "shelfshare.restricted" . | nindent 8 }}
