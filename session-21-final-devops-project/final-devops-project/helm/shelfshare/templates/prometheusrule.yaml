{{- if .Values.monitoring.rules.enabled }}
{{- $ns := .Release.Namespace }}
{{- $name := include "shelfshare.name" . }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $name }}
  labels: {{- include "shelfshare.labels" . | nindent 4 }}
spec:
  groups:
    - name: shelfshare.alerts
      rules:
        - alert: ShelfShareBackendDown
          expr: sum(kube_deployment_status_replicas_available{namespace="{{ $ns }}",deployment="{{ $name }}-backend"}) < 1
          for: 1m
          labels: {severity: critical, team: shelfshare}
          annotations:
            summary: "ShelfShare API has no available replicas"
        - alert: ShelfShareDatabaseDown
          expr: sum(kube_statefulset_status_replicas_ready{namespace="{{ $ns }}",statefulset="{{ $name }}-postgres"}) < 1
          for: 1m
          labels: {severity: critical, team: shelfshare}
          annotations:
            summary: "ShelfShare PostgreSQL is not ready"
        - alert: ShelfShareHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="{{ $ns }}",status="5xx"}[2m]))
              / sum(rate(http_requests_total{namespace="{{ $ns }}"}[2m])) > 0.05
          for: 2m
          labels: {severity: warning, team: shelfshare}
          annotations:
            summary: "More than 5% of ShelfShare API requests fail"
        - alert: ShelfShareHighLatency
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_highr_seconds_bucket{namespace="{{ $ns }}"}[5m]))) > 0.5
          for: 5m
          labels: {severity: warning, team: shelfshare}
          annotations:
            summary: "ShelfShare API p95 latency above 500 ms"
{{- end }}
