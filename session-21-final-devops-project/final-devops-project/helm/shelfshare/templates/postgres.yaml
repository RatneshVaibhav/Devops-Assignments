{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shelfshare.name" . }}-postgres
  labels:
    {{- include "shelfshare.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector: {{- include "shelfshare.selector" (dict "Release" .Release "component" "postgres") | nindent 4 }}
  ports:
    - {name: postgres, port: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "shelfshare.name" . }}-postgres
  labels:
    {{- include "shelfshare.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "shelfshare.name" . }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "shelfshare.selector" (dict "Release" .Release "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "shelfshare.selector" (dict "Release" .Release "component" "postgres") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_DB, value: {{ .Values.database.name | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.database.user | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: {{ .Values.database.passwordKey }}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.postgres.storage }}}
{{- end }}
