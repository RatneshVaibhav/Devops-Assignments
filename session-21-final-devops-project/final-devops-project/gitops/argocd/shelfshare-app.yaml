# Argo CD renders the Helm chart from the GitOps repository with the environment's values
# and keeps the shelfshare namespace equal to it (prune + self-heal).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shelfshare-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ratnesh/shelfshare-gitops.git
    targetRevision: main
    path: charts/shelfshare
    helm:
      releaseName: shelfshare
      valueFiles:
        - ../../environments/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shelfshare
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
